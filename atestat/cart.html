<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: 'Arial', serif;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #333;
        overflow-x: hidden;
      }
  
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
  
      .navbar {
        display: flex;
        justify-content: center;
        background-color: #222;
        padding: 15px 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        width: 100%;
        position: fixed;
        top: 0;
        z-index: 10;
      }
  
      .navbar a {
        text-decoration: none;
        color: #fff;
        font-size: 18px;
        padding: 14px 20px;
        margin: 0 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.3s ease, transform 0.3s ease;
      }
  
      .navbar a:hover {
        color: #d3af37;
        transform: translateY(-3px);
      }
  
      .navbar a.active {
        border-bottom: 3px solid #d3af37;
      }
  
      .intro1 {
        width: 100%;
        height: 100vh;
        position: relative;
      }
  
      .intro1 video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        z-index: -1;
        backdrop-filter: blur(8px);
      }
  
      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(46, 46, 46, 0.8); 
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 900px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
      }
  
      .left {
        width: 45%;
      }
  
      .right {
        width: 45%;
        text-align: center;
      }
  
      .container h2 {
        font-size: 2rem;
        margin-bottom: 20px;
        letter-spacing: 1px;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }
  
      .container p {
        color: #fff;
        font-size: 1.1rem;
      }
  
      .input-field,
      .quantity-dropdown {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        background: #444;
        color: white;
        border: 1px solid #555;
        border-radius: 8px;
        font-size: 16px;
        transition: border 0.3s ease;
      }
  
      .input-field:focus,
      .quantity-dropdown:focus {
        border-color: #d3af37;
        outline: none;
      }
  
      button {
        background: #5e5e5e;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        margin: 10px 0;
        width: 100%;
      }
  
      button:hover {
        background: #d3af37;
        color: #222;
        transform: translateY(-2px);
      }
  
      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
        position: absolute;
        bottom: 0;
        width: 100%;
      }
  
      footer a {
        color: #003bfc96;
        text-decoration: none;
        font-weight: bold;
      }
  
      .image-container {
        margin: 20px 0;
        text-align: center;
      }
  
      .image-container img {
        width: 100%;
        max-width: 300px;
        height: auto;
        border-radius: 10px;
      }
  
      .cart-buttons {
        display: flex;
        flex-direction: column;
        margin-top: 20px;
      }
  
      .cart-buttons button {
        width: 100%;
      }
    </style>
      
  </head>

  <body>
    <div class="navbar">
      <a href="./home.html">Home</a>
      <a href="./produse.html">Our Catalog</a>
      <a href="./log in.html">Log in</a>
      <a href="./contact.html">Contact</a>
      <a href="./map.html">Map</a>
      <a href="./cart.html" class="active">Your cart</a>
    </div>

    <div class="intro1">
      <video
        src="./LUXURY INTERIOR DESIGN_ for spending the best life (2).mp4"
        autoplay
        muted
        loop
      ></video>
    </div>

    <div class="container">
      <div class="left">
        <h2>Your Cart</h2>
        <p>Here are the items you have added to your cart:</p>

        <ul id="cart-items" style="color:white"></ul>
        <p id="cart-total" style="color:white">Total: 0 US DOLLARS</p>

        <div class="cart-buttons">
          <button onclick="renderCart()">Refresh the cart</button>
          <button onclick="deleteCart()">Delete cart</button>
          <button onclick="window.location.href='./produse.html'">Continue Shopping</button>
          <button onclick="window.location.href='./checkout.html'">Checkout</button>
        </div>

        <div id="paypal-button-container"></div>
        <script src="https://www.paypal.com/sdk/js?client-id=AeGBozubpPqhdyADg8yZ9enX4xX_mETtOIbSdP7s5P5eMoiMCnzMM-4zShEoGz4VtuYOHcfrmaF3W53_&enable-funding=venmo&currency=EUR" data-sdk-integration-source="button-factory"></script>
      </div>

      <div class="right">
        <div class="image-container">
          <img src="./cart icon.png" alt="Product Image" />
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2025 Fruit Salad. All rights reserved.</p>
      <p>
        <a href="privacy.html">Privacy Policy</a> |
        <a href="./terms.html">Terms of Service</a>
      </p>
    </footer>

    <script>
      function renderCart() {
        const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
        const cartList = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        cartList.innerHTML = '';
        let total = 0;

        if (cartItems.length === 0) {
          cartList.innerHTML = '<li>No items in your cart.</li>';
        } else {
          cartItems.forEach((item, index) => {
            const li = document.createElement('li');
            li.textContent = `${item.name} - ${item.price} USD`;
            cartList.appendChild(li);
            total += parseFloat(item.price);
          });
        }

        cartTotal.textContent = `Total: ${total.toFixed(2)} US DOLLARS`;
      }

      function deleteCart() {
        localStorage.removeItem('cart');
        renderCart();
      }

      // Render on load
      window.onload = renderCart;
    </script>
  </body>
</html>
