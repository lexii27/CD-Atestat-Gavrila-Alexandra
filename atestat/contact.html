<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Interior Design</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="@import url('https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..800&family=Birthstone&family=Italiana&display=swap');"
      rel="stylesheet"
    />

    <style>
      body {
        width: 100%;
        height: 100%;
        background-color: #f9f9f9;
        font-family: "Times New Roman", Times, serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 10px 50px;
        position: fixed;
        width: 100%;
        z-index: 10;
      }

      .navbar {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .navbar a {
        color: black;
        font-weight: bold;
        opacity: 60%;
        font-size: 12px;
        text-decoration: none;
        transition: font-size 0.3s ease-in-out;
      }

      .navbar a:hover {
        opacity: 100%;
        font-size: 15px;
      }

      .logo-container {
        display: flex;
        align-items: center;
        transition: transform 0.3s ease-in-out;
      }

      .logo-container:hover {
        transform: scale(1.05);
      }

      .logo-container img {
        width: 150px;
        height: 30px;
      }

      .header2 {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        padding: 10px 50px;
        margin-top: 80px;
      }

      .h1 {
        text-align: center;
        color: rgb(216, 221, 211);
        font-size: 2rem;
        margin-top: 100px;
        font-weight: bold;
      }

      .contact-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 40px 20px;
        background-color: white;
        max-width: 600px;
        margin: 40px auto;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      .contact-form button {
        background-color: #007bff;
        color: white;
        font-weight: bold;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .contact-form button:hover {
        background-color: #0056b3;
      }

      footer {
        background-color: #333;
        color: white;
        text-align: center;
        padding: 20px;
      }

      footer a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img
          src="https://static.vecteezy.com/system/resources/thumbnails/019/787/015/small/shopping-cart-icon-shopping-basket-on-transparent-background-free-png.png"
          alt="Logo"
        />
      </div>
      <nav class="navbar">
        <a href="./Academy.html">Home</a>
        <a href="./Support.html">Support</a>
        <a href="./Search.html">Search</a>
        <a href="./Contact.html">Contact</a>
        <div class="tooltip">
          <a href="register.html">Log in/ Register</a>
          <div class="tooltiptext">
            <input type="email" placeholder="Your email:" />
