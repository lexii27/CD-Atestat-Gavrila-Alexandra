<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype - Live Map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@300..800&family=Birthstone&family=Italiana&display=swap"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        width: 100%;
        height:100vh;
        background-color: #1c1c1c;
        color: #fff;
        overflow-x: hidden;
      }

      .navbar {
        display: flex;
        justify-content: center;
        background-color: #222;
        padding: 20px 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .navbar a {
        text-decoration: none;
        color: #fff;
        font-size: 18px;
        padding: 14px 20px;
        margin: 0 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.3s ease, transform 0.3s ease;
      }

      .navbar a:hover {
        color: #D3AF37;
        transform: translateY(-3px);
      }

      .navbar a.active {
        border-bottom: 3px solid #D3AF37;
      }
      .map{
        height:100vh;
        width:100%;
        margin: 0 auto;
      }

      footer {
        background-color: #222;
        color: #fff;
        text-align: center;
        padding: 20px;
        margin-top: 50px;
      }

      footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: bold;
      }

    </style>
  </head>
  <body>
    
    <div class="navbar">
      <a href="./home.html">Home</a>
      <a href="./produse.html">Our Catalog</a>
      <a href="./log in.html">Log in</a>
      <a href="./contact.html">Contact</a>
      <a href="./map.html" class="active">Map</a>
      <a href="./cart.html">Your cart</a>
    </div>

    
    <div id="map"></div>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2782.9023169978!2d21.222764512238044!3d45.7731478709601!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47456797a1429ad3%3A0x3ec17538ea1e46e!2sAleea%20Speran%C8%9Bei%203%2C%20Timi%C8%99oara%20300254!5e0!3m2!1sen!2sro!4v1743148600974!5m2!1sen!2sro" width="1200" height="900" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="map"></iframe>

   
    <footer>
      <p>&copy; 2025 Fruit Salad. All rights reserved.</p>
      <p><a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
    </footer>
  </body>
</html>
